name: Lint

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    name: Lint Last.fm Recommender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run Home Assistant App Lint
        uses: frenck/action-addon-linter@v2.21
        with:
          path: ./lastfm_recommender
