name: Build app
on:
  push:
    branches: [main]
    paths: ["lastfm_recommender/**", ".github/workflows/build.yaml"]
  pull_request:
    paths: ["lastfm_recommender/**", ".github/workflows/build.yaml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ./lastfm_recommender
          platforms: linux/amd64,linux/arm64
          push: false
          tags: lastfm-recommender:test
          pull: true
          no-cache: true
