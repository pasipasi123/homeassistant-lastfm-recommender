name: Last.fm Recommender
version: "0.3.4.5"
slug: lastfm_recommender
description: Rediscover forgotten albums from your Last.fm listening history
url: https://github.com/pasipasi123/homeassistant-lastfm-recommender
arch:
  - aarch64
  - amd64
init: false
ingress: true
ingress_port: 8098
panel_title: Music
panel_icon: mdi:music
homeassistant_api: true
ports:
  8099/tcp: null
ports_description:
  8099/tcp: Optional direct web/API access (requires api_token)
options:
  lastfm_username: ""
  lastfm_api_key: ""
  api_token: ""
  timezone: Europe/Helsinki
  sync_interval_minutes: 360
  enrich_batch_size: 10
  enrich_interval_minutes: 5
  lastfm_batch_size: 50
  lastfm_interval_minutes: 1
  spotify_client_id: ""
  spotify_client_secret: ""
  spotify_market: FI
  volume_min: 0.0
  volume_max: 100.0
  volume_step: 1.0
  volume_decimals: 1
schema:
  lastfm_username: str
  lastfm_api_key: password
  api_token: password?
  timezone: str
  sync_interval_minutes: int(5,1440)
  enrich_batch_size: int(0,100)
  enrich_interval_minutes: int(1,1440)
  lastfm_batch_size: int(0,100)?
  lastfm_interval_minutes: int(1,1440)?
  spotify_client_id: str?
  spotify_client_secret: password?
  spotify_market: match(^[A-Z]{2}$)?
  volume_min: float(-200,200)?
  volume_max: float(-200,200)?
  volume_step: float(0.01,400)?
  volume_decimals: int(0,2)?
# No image key: Supervisor builds this first release locally from the repository.
