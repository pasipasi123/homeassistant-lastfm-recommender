# Copy to /config/packages/lastfm_music.yaml.
# Replace HA_SERVER_IP in both URLs and media_player.your_spotifyplus_player below.
# Keep API credentials in secrets.yaml.
input_text:
  lastfm_genre:
    name: Lastfm genre
    icon: mdi:tag-multiple
    max: 100

input_number:
  lastfm_years_unheard:
    name: Minimum years since last listen
    min: 0
    max: 50
    step: 1
    initial: 3
    mode: box
  lastfm_min_scrobbles:
    name: Minimum scrobbles
    min: 1
    max: 1000
    step: 1
    initial: 10
    mode: box

input_select:
  lastfm_genre_context:
    name: Genre suggestions
    options:
      - Around this time
      - All genres
    initial: Around this time
    icon: mdi:clock-outline

rest:
  - resource: "http://HA_SERVER_IP:8099/api/genres?limit=500"
    headers:
      Authorization: !secret lastfm_recommender_authorization
    scan_interval: 900
    timeout: 30
    sensor:
      - name: Lastfm genres
        unique_id: lastfm_genres
        value_template: "{{ value_json.total_genres }}"
        json_attributes:
          - genres
          - contextual_genres
          - context
          - tagged_albums
          - total_albums
          - total_genres
          - has_more

rest_command:
  lastfm_music_recommend:
    url: >-
      http://HA_SERVER_IP:8099/api/recommend?genre={{ genre | urlencode }}&min_years_unheard={{ years | int }}&min_total_scrobbles={{ scrobbles | int }}&playable_only=true
    headers:
      Authorization: !secret lastfm_recommender_authorization
    timeout: 30

template:
  - triggers:
      - trigger: event
        event_type: lastfm_music_recommendation
    sensor:
      - name: Lastfm recommendation
        unique_id: lastfm_recommendation
        device_class: timestamp
        state: "{{ now().isoformat() }}"
        attributes:
          album: "{{ trigger.event.data.album }}"
          genre: "{{ trigger.event.data.genre }}"
          min_years_unheard: "{{ trigger.event.data.min_years_unheard }}"
          min_total_scrobbles: "{{ trigger.event.data.min_total_scrobbles }}"
          error: "{{ trigger.event.data.error }}"

script:
  lastfm_music_recommend:
    alias: Last.fm – Find a forgotten favorite
    mode: restart
    sequence:
      - variables:
          selected_genre: "{{ states('input_text.lastfm_genre') if states('input_text.lastfm_genre') not in ['unknown', 'unavailable'] else '' }}"
          selected_years: "{{ states('input_number.lastfm_years_unheard') | int(3) }}"
          selected_scrobbles: "{{ states('input_number.lastfm_min_scrobbles') | int(10) }}"
          lastfm_response:
            status: 0
            content: {}
      - action: rest_command.lastfm_music_recommend
        data:
          genre: "{{ selected_genre }}"
          years: "{{ selected_years }}"
          scrobbles: "{{ selected_scrobbles }}"
        response_variable: lastfm_response
        continue_on_error: true
      - variables:
          result: "{{ lastfm_response.content if lastfm_response is mapping and lastfm_response.get('status') == 200 and lastfm_response.get('content') is mapping else {} }}"
      - event: lastfm_music_recommendation
        event_data:
          album: "{{ result.get('album') }}"
          genre: "{{ selected_genre }}"
          min_years_unheard: "{{ selected_years }}"
          min_total_scrobbles: "{{ selected_scrobbles }}"
          error: "{{ '' if 'album' in result else 'Could not load a recommendation. Check the app and REST configuration.' }}"

  lastfm_music_play:
    alias: Last.fm – Play selected album
    mode: single
    sequence:
      - variables:
          album: "{{ state_attr('sensor.lastfm_recommendation', 'album') }}"
      - if:
          - condition: template
            value_template: >-
              {{ album is not mapping or album.get('spotify_status') != 'confirmed'
                 or not (album.get('spotify_uri', '') | regex_match('^spotify:album:[A-Za-z0-9]{22}$'))
                 or (state_attr('sensor.lastfm_recommendation', 'genre') or '') !=
                    (states('input_text.lastfm_genre') if states('input_text.lastfm_genre') not in ['unknown', 'unavailable'] else '')
                 or state_attr('sensor.lastfm_recommendation', 'min_years_unheard') | int(-1) != states('input_number.lastfm_years_unheard') | int(3)
                 or state_attr('sensor.lastfm_recommendation', 'min_total_scrobbles') | int(-1) != states('input_number.lastfm_min_scrobbles') | int(10) }}
        then:
          - stop: "Find an album for the current filters before starting playback."
      - action: spotifyplus.player_media_play_context
        data:
          entity_id: media_player.your_spotifyplus_player
          context_uri: "{{ album.spotify_uri }}"
